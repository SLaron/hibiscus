<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hi bebu</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>
    <p class="title">Hello my babie <33</p>
    <img src="photos/sillyweclomecat.jpeg" class="pic">
    <p></p>
    <button class="cute-button" onclick="jsbuttonclick()"> hullu :3 </button>
    <p class="js-pause pause_button" onclick="update_music()"></p>
<script>
    const mouse_click = new Audio("audio/mouse-click.mp3");
    mouse_click.volume = 1;
    const bg_music = new Audio("audio/kitty_song.mp3");
    let music_status = 0;
    const status = document.querySelector('.js-pause')
function jsbuttonclick(){
    mouse_click.currentTime = 0;
    bg_music.loop = true;
    mouse_click.play();
    bg_music.play();
    status.innerText="⏸️";
    window.open("clickme-game.html", "_blank");
    return;
}
function update_music(){
    if(music_status === 0){
    bg_music.pause();
    bg_music.currentTime = 0;
    music_status=1;
    status.innerText="▶️";}
    else if(music_status = 1){
    bg_music.play();
    bg_music.currentTime = 0;
    status.innerText="⏸️"; 
    music_status=0;
    }
}
</script>
</body>
</html>
